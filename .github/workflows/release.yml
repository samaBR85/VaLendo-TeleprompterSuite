# Constrói os instaladores dos três alvos e anexa na release da tag.
#
# Existe porque o macOS não pode ser construído a partir do Windows: as
# ferramentas de assinatura da Apple só rodam em macOS. Em vez de exigir que
# alguém tenha as duas máquinas ligadas na hora de lançar, a tag dispara os
# builds em runners da GitHub.
#
# São TRÊS jobs, e não dois, porque cada arquitetura de Mac compila o próprio
# ffmpeg — `macos-14` é Apple Silicon e faz o arm64, `macos-13` é Intel e faz o
# x64. Compilação cruzada seria possível e é uma fonte de erro a mais num
# processo que já tem partes delicadas; alugar a máquina certa sai de graça.
name: Release

on:
  push:
    tags:
      - 'v*'
  # para reconstruir um artefato sem criar tag nova
  workflow_dispatch:

# o build anexa arquivos na release, e para isso precisa escrever no repositório
permissions:
  contents: write

jobs:
  build:
    strategy:
      # um alvo falhar não pode cancelar os outros: quem tiver instalador ainda
      # ganha o dele, e o erro fica isolado onde aconteceu
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows
            arch: ''
            artefatos: dist/*-setup.exe
          - os: macos-14
            nome: macos-arm64
            arch: '--arm64'
            artefatos: dist/*.dmg
          - os: macos-13
            nome: macos-x64
            arch: '--x64'
            artefatos: dist/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` e não `install`: o lock manda, e o build de release não é hora de
      # descobrir que uma dependência subiu de versão sozinha
      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      # ------------------------------------------------------------ ffmpeg
      #
      # Só no macOS, e por um motivo de licença, não de gosto: o binário de Mac
      # que o `ffmpeg-static` baixa vem com `--enable-nonfree`, e o próprio
      # FFmpeg diz que isso o torna não redistribuível. Compilamos o nosso,
      # sob GPL v3, e sobrescrevemos o baixado antes de empacotar.
      #
      # O cache é por versão do ffmpeg E por arquitetura: sem a segunda parte,
      # o arm64 herdaria o binário Intel e o app abriria com um ffmpeg que não
      # roda naquela máquina.
      - name: Cache do ffmpeg compilado
        if: startsWith(matrix.os, 'macos')
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: .ffmpeg-build/ffmpeg
          key: ffmpeg-6.1.1-${{ matrix.nome }}-v1

      - name: Compilar o ffmpeg
        if: startsWith(matrix.os, 'macos') && steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-mac.sh

      - name: Trocar o ffmpeg do pacote pelo nosso
        if: startsWith(matrix.os, 'macos')
        run: |
          set -euo pipefail
          # a guarda roda SEMPRE, inclusive quando o binário veio do cache: um
          # cache envenenado passaria despercebido, que é exatamente o tipo de
          # falha silenciosa que trouxe o projeto até aqui
          .ffmpeg-build/ffmpeg -version | head -2
          if .ffmpeg-build/ffmpeg -version | grep -q -- "--enable-nonfree"; then
            echo "ERRO: ffmpeg com --enable-nonfree; não pode ser distribuído." >&2
            exit 1
          fi
          cp .ffmpeg-build/ffmpeg node_modules/ffmpeg-static/ffmpeg
          chmod +x node_modules/ffmpeg-static/ffmpeg

      # os scripts levam `--publish never` de propósito: numa CI o
      # electron-builder decide publicar a release sozinho, e aí exige um
      # GH_TOKEN que este workflow não dá a ele. Quem anexa os arquivos é o
      # passo abaixo, com a permissão que o próprio GitHub já concede ao job.
      - name: Build
        run: npm run ${{ matrix.nome == 'windows' && 'dist:win' || 'dist:mac' }} -- ${{ matrix.arch }}
        env:
          # sem isto o electron-builder vasculha o chaveiro do runner atrás de
          # um certificado da Apple, não acha, e demora ou falha por causa de
          # algo que este projeto deliberadamente não tem. A assinatura ad-hoc
          # — a que faz o app abrir em Apple Silicon — continua sendo aplicada.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # cinto de segurança: cada job de Mac tem de entregar UM arquivo, o da
      # arquitetura dele. Se aparecer mais de um, o config voltou a listar
      # `arch` e o pacote de uma arquitetura está levando o ffmpeg da outra
      - name: Conferir que saiu só a arquitetura deste job
        if: startsWith(matrix.os, 'macos')
        run: |
          set -euo pipefail
          ls -1 dist/*.dmg
          QUANTOS=$(ls -1 dist/*.dmg | wc -l | tr -d ' ')
          if [ "$QUANTOS" != "1" ]; then
            echo "ERRO: $QUANTOS .dmg neste job; esperado 1." >&2
            exit 1
          fi

      - name: Anexar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artefatos }}
          fail_on_unmatched_files: true

      # sem tag (workflow_dispatch) o artefato fica guardado no próprio job,
      # para baixar e testar antes de decidir que vira release
      - name: Guardar para download
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: valendo-${{ matrix.nome }}
          path: ${{ matrix.artefatos }}
