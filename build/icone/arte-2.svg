<!--
  Ícone do Valendo — arte MÉDIA (32 e 48px).

  Duas linhas em vez de três. A terceira era a mais apagada e a mais curta, e é
  a primeira a virar mancha quando o ícone encolhe: some antes de informar
  qualquer coisa. As duas que ficam mantêm a leitura — o que está sendo lido e
  o que vem depois.

  A linha de baixo sobe de 16% para 38% de opacidade: com uma vizinha a menos,
  ela precisa carregar sozinha a ideia de "o que ainda vem".
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect x="0" y="0" width="1024" height="1024" rx="235" ry="235" fill="#101013" />
  <rect x="5" y="5" width="1014" height="1014" rx="230" ry="230" fill="none" stroke="#46d17f" stroke-opacity="0.45" stroke-width="10" />

  <text
    x="512"
    y="646"
    text-anchor="middle"
    font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="520"
    font-weight="500"
    letter-spacing="-12"
    fill="#46d17f"
  >Va</text>

  <rect x="277" y="667" width="469" height="32" rx="16" fill="#f2f2f4" />
  <rect x="362" y="720" width="299" height="32" rx="16" fill="#f2f2f4" fill-opacity="0.38" />
</svg>
